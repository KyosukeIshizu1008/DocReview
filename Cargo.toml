[package]
name = "jira_ai"
version = "0.1.0"
edition = "2021"
description = "egui-based RAG app over Jira & Confluence Cloud"

[dependencies]
# --- GUI ---
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui = "0.29"

# --- Async ---
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "time"] }
futures = "0.3"

# --- HTTP (Atlassian + LLM APIs) ---
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "stream"] }
url = "2"
base64 = "0.22"

# --- Serialization / Errors / Logging ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# --- Storage / Config ---
directories = "5"
keyring = { version = "3", features = ["apple-native"] }

# --- Text processing ---
scraper = "0.20"
text-splitter = "0.20"
quick-xml = "0.36"
flate2 = "1"

# --- Vector DB ---
# 埋め込みは Gemini API (reqwest 経由) を使うため、ローカル ONNX ランタイムは不要。
lancedb = "0.30"
arrow-array = "58"
arrow-schema = "58"

# --- Date/time ---
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
flate2 = "1"

[profile.release]
opt-level = 3
lto = "thin"
